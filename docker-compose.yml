services:
  db:
    image: postgres:16-alpine
    container_name: tripitaka-db
    environment:
      POSTGRES_DB: tripitaka
      POSTGRES_USER: tripitaka
      POSTGRES_PASSWORD: tripitaka
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tripitaka -d tripitaka"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
